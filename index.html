<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Creator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Pixel Art Creator</h1>
            <p class="subtitle">클릭하고 드래그해서 픽셀 아트를 그려보세요!</p>
        </header>

        <div class="toolbar">
            <div class="tool-group">
                <label>브러시 색상</label>
                <input type="color" id="color-picker" value="#000000">
                <div class="palette" id="palette"></div>
            </div>

            <div class="tool-group">
                <label>도구</label>
                <div class="tool-buttons">
                    <button class="tool-btn active" data-tool="brush" title="브러시">&#9998;</button>
                    <button class="tool-btn" data-tool="eraser" title="지우개">&#9003;</button>
                    <button class="tool-btn" data-tool="fill" title="채우기">&#9681;</button>
                    <button class="tool-btn" data-tool="line" title="직선">╲</button>
                    <button class="tool-btn" data-tool="rect" title="사각형">▭</button>
                    <button class="tool-btn" data-tool="circle" title="원">◯</button>
                    <button class="tool-btn" data-tool="eyedropper" title="스포이드">💉</button>
                    <button class="tool-btn" data-tool="select" title="선택">⬚</button>
                </div>
            </div>

            <div class="tool-group">
                <label>대칭</label>
                <select id="symmetry-mode">
                    <option value="none">없음</option>
                    <option value="horizontal">좌우</option>
                    <option value="vertical">상하</option>
                    <option value="both">4방향</option>
                    <option value="radial4">회전 4</option>
                    <option value="radial6">회전 6</option>
                    <option value="radial8">회전 8</option>
                </select>
            </div>

            <div class="tool-group">
                <label>캔버스 크기</label>
                <select id="grid-size">
                    <option value="8">8 x 8</option>
                    <option value="16" selected>16 x 16</option>
                    <option value="32">32 x 32</option>
                    <option value="48">48 x 48</option>
                </select>
            </div>

            <div class="tool-group">
                <label>격자선</label>
                <button id="toggle-grid" class="tool-btn active" title="격자선 토글">&#9638;</button>
            </div>

            <div class="tool-group">
                <label>실행취소</label>
                <div class="tool-buttons">
                    <button id="undo-btn" class="tool-btn" title="실행 취소 (Ctrl+Z)">↩</button>
                    <button id="redo-btn" class="tool-btn" title="다시 실행 (Ctrl+Y)">↪</button>
                </div>
            </div>

            <div class="tool-group">
                <label>도형 옵션</label>
                <button id="shape-fill-toggle" class="tool-btn" title="채움/윤곽">☐</button>
            </div>

            <div class="tool-group actions">
                <button id="clear-btn" class="action-btn danger">초기화</button>
                <button id="save-btn" class="action-btn primary">프로젝트 저장</button>
                <button id="load-btn" class="action-btn primary">불러오기</button>
                <button id="export-btn" class="action-btn primary">PNG</button>
                <button id="export-gif-btn" class="action-btn primary">GIF</button>
                <button id="export-sheet-btn" class="action-btn primary">스프라이트</button>
            </div>
        </div>

        <div class="canvas-wrapper">
            <div class="canvas" id="canvas"></div>
        </div>

        <div class="timeline-panel" id="timeline-panel">
            <div class="timeline-header">
                <h3>애니메이션</h3>
                <div class="timeline-controls">
                    <button id="onion-skin-btn" class="layer-action-btn" title="어니언 스킨">🧅</button>
                    <label class="fps-label">FPS:
                        <input type="number" id="fps-input" min="1" max="60" value="8" class="fps-input">
                    </label>
                </div>
            </div>
            <div class="timeline-playback">
                <button id="prev-frame-btn" class="layer-action-btn" title="이전 프레임">◀</button>
                <button id="play-btn" class="layer-action-btn" title="재생/정지">▶</button>
                <button id="next-frame-btn" class="layer-action-btn" title="다음 프레임">▶</button>
                <span id="frame-counter" class="frame-counter">1 / 1</span>
                <button id="add-frame-btn" class="layer-action-btn" title="프레임 추가">+</button>
                <button id="dup-frame-btn" class="layer-action-btn" title="프레임 복제">⧉</button>
                <button id="del-frame-btn" class="layer-action-btn" title="프레임 삭제">✕</button>
            </div>
            <div class="frame-strip" id="frame-strip"></div>
        </div>

        <div class="color-tools-panel" id="color-tools-panel">
            <div class="layer-panel-header">
                <h3>색상 도구</h3>
            </div>
            <div class="color-tools-row">
                <div class="color-harmony" id="color-harmony"></div>
                <div class="color-gradient" id="color-gradient"></div>
            </div>
            <div class="color-history-row">
                <label class="fps-label">최근 사용</label>
                <div class="color-history" id="color-history"></div>
            </div>
        </div>

        <div class="selection-bar" id="selection-bar" style="display:none;">
            <button id="sel-copy" class="layer-action-btn" title="복사">📋</button>
            <button id="sel-cut" class="layer-action-btn" title="잘라내기">✂</button>
            <button id="sel-paste" class="layer-action-btn" title="붙여넣기">📌</button>
            <button id="sel-deselect" class="layer-action-btn" title="선택 해제">✕</button>
            <button id="sel-flip-h" class="layer-action-btn" title="좌우 반전">↔</button>
            <button id="sel-flip-v" class="layer-action-btn" title="상하 반전">↕</button>
        </div>

        <div class="layer-panel" id="layer-panel">
            <div class="layer-panel-header">
                <h3>레이어</h3>
                <div class="layer-actions">
                    <button id="add-layer-btn" class="layer-action-btn" title="레이어 추가">+</button>
                    <button id="merge-layer-btn" class="layer-action-btn" title="아래로 병합">&#8615;</button>
                    <button id="flatten-btn" class="layer-action-btn" title="모두 병합">&#9776;</button>
                    <button id="delete-layer-btn" class="layer-action-btn" title="레이어 삭제">&#10005;</button>
                </div>
            </div>
            <div class="layer-list" id="layer-list"></div>
        </div>
    </div>

    <script src="layers.js"></script>
    <script src="history.js"></script>
    <script src="tools.js"></script>
    <script src="colortools.js"></script>
    <script src="selection.js"></script>
    <script src="symmetry.js"></script>
    <script src="animation.js"></script>
    <script src="filemanager.js"></script>
    <script src="app.js"></script>
</body>
</html>
